      <stop offset="0.5" stop-color="#111B32"/>
      <stop offset="1" stop-color="#1A1031"/>
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="120" x2="1340" y2="760" gradientUnits="userSpaceOnUse">
