<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">End-to-End Customer Personality Project</title>
  <desc id="desc">Banner image for a customer personality project with analysis pipeline and notebook list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071120"/>
      <stop offset="0.5" stop-color="#0f1b2e"/>
      <stop offset="1" stop-color="#1b1031"/>
    </linearGradient>
    <linearGradient id="accent" x1="200" y1="60" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.35" stop-color="#60A5FA"/>
      <stop offset="0.7" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101D34" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#1A1836" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020817" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <g opacity="0.18">
    <circle cx="130" cy="100" r="200" fill="#22D3EE"/>
    <circle cx="1490" cy="90" r="250" fill="#A78BFA"/>
    <circle cx="1520" cy="420" r="220" fill="#60A5FA"/>
    <circle cx="180" cy="440" r="170" fill="#EC4899"/>
  </g>

  <g opacity="0.12" stroke="#9DDCFD" stroke-width="1">
    <path d="M0 80H1600"/>
    <path d="M0 160H1600"/>
    <path d="M0 240H1600"/>
    <path d="M0 320H1600"/>
    <path d="M0 400H1600"/>
    <path d="M120 0V500"/>
    <path d="M360 0V500"/>
    <path d="M600 0V500"/>
    <path d="M840 0V500"/>
    <path d="M1080 0V500"/>
    <path d="M1320 0V500"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="70" width="640" height="360" rx="30" fill="url(#card)" stroke="rgba(255,255,255,0.16)"/>
  </g>

  <rect x="100" y="95" width="165" height="30" rx="15" fill="#0f172a" stroke="#67E8F9"/>
  <text x="182.5" y="116" text-anchor="middle" fill="#C8F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PROJECT</text>

  <text x="100" y="190" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-1.5">
    <tspan x="100" dy="0">End-to-End</tspan>
    <tspan x="100" dy="56">Customer</tspan>
    <tspan x="100" dy="56">Personality</tspan>
    <tspan x="100" dy="56">Project</tspan>
  </text>

  <rect x="100" y="355" width="220" height="6" rx="3" fill="url(#accent)"/>
  <text x="100" y="390" fill="#DDEEFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500">Customer analytics • segmentation • CLTV</text>

  <g filter="url(#shadow)">
    <rect x="760" y="70" width="770" height="360" rx="30" fill="#0B1225" stroke="rgba(148,163,184,0.35)"/>
  </g>

  <text x="800" y="110" fill="#8ED6FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">ANALYSIS PIPELINE</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-weight="600">
    <g>
      <rect x="800" y="138" width="310" height="36" rx="18" fill="#12213B"/>
      <circle cx="820" cy="156" r="7" fill="#67E8F9"/>
      <text x="840" y="162" fill="#EEF9FF" font-size="14">01. Data Preparation</text>
    </g>

    <g>
      <rect x="800" y="186" width="310" height="36" rx="18" fill="#12213B"/>
      <circle cx="820" cy="204" r="7" fill="#60A5FA"/>
      <text x="840" y="210" fill="#EEF9FF" font-size="14">02. Demographics Analysis</text>
    </g>

    <g>
      <rect x="800" y="234" width="310" height="36" rx="18" fill="#12213B"/>
      <circle cx="820" cy="252" r="7" fill="#8B5CF6"/>
      <text x="840" y="258" fill="#EEF9FF" font-size="14">03. Spending Habits Analysis</text>
    </g>

    <g>
      <rect x="800" y="282" width="310" height="36" rx="18" fill="#12213B"/>
      <circle cx="820" cy="300" r="7" fill="#F472B6"/>
      <text x="840" y="306" fill="#EEF9FF" font-size="14">04. Product Purchasing Behaviour</text>
    </g>

    <g>
      <rect x="1130" y="138" width="350" height="36" rx="18" fill="#12213B"/>
      <circle cx="1150" cy="156" r="7" fill="#34D399"/>
      <text x="1170" y="162" fill="#EEF9FF" font-size="14">05. Family Structure Analysis</text>
    </g>

    <g>
      <rect x="1130" y="186" width="350" height="36" rx="18" fill="#12213B"/>
      <circle cx="1150" cy="204" r="7" fill="#F59E0B"/>
      <text x="1170" y="210" fill="#EEF9FF" font-size="14">06. Marketing Campaign Analysis</text>
    </g>

    <g>
      <rect x="1130" y="234" width="350" height="36" rx="18" fill="#12213B"/>
      <circle cx="1150" cy="252" r="7" fill="#22D3EE"/>
      <text x="1170" y="258" fill="#EEF9FF" font-size="14">07. RFM Segmentation</text>
    </g>

    <g>
      <rect x="1130" y="282" width="350" height="36" rx="18" fill="#12213B"/>
      <circle cx="1150" cy="300" r="7" fill="#C084FC"/>
      <text x="1170" y="306" fill="#EEF9FF" font-size="14">08. High-Value Prediction &amp; Pareto</text>
    </g>

    <g>
      <rect x="980" y="340" width="500" height="36" rx="18" fill="#12213B"/>
      <circle cx="1000" cy="358" r="7" fill="#60A5FA"/>
      <text x="1020" y="364" fill="#EEF9FF" font-size="14">09. CLTV Probabilistic Models</text>
    </g>
  </g>

  <g>
    <circle cx="1450" cy="395" r="40" fill="url(#accent)" opacity="0.2"/>
    <circle cx="1450" cy="395" r="18" fill="url(#accent)"/>
    <path d="M1442 395L1448 401L1460 389" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
